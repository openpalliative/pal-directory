quotes:
- point: прил. 1, п. 2
  text_verbatim: 'Паллиативная медицинская помощь взрослому населению Костромской области в амбулаторных условиях, в том числе на дому, оказывается: 1) в кабинетах паллиативной медицинской помощи (далее
    - кабинеты ПМП) областных государственных медицинских организаций Костромской области (далее - медицинские организации), оказывающих первичную медико-санитарную помощь; 2) в кабинетах ПМП медицинских
    организаций, оказывающих специализированную помощь; 3) выездными патронажными службами медицинских организаций (далее - ВПС).'
  page: 5
  verified: false
- point: прил. 1, п. 3
  text_verbatim: Паллиативная медицинская помощь взрослому населению Костромской области в стационарных условиях оказывается медицинскими организациями, оказывающими специализированную, в том числе высокотехнологичную,
    медицинскую помощь и имеющими в своем составе отделения паллиативной медицинской помощи, отделения сестринского ухода.
  page: 5
  verified: false
