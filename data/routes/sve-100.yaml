related_acts:
- title: Приказ Министерства здравоохранения Свердловской области от 22.04.2026 № 557-п «О совершенствовании паллиативной медицинской помощи детям в системе здравоохранения Свердловской области»
  number: 557-п
  date: '2026-04-22'
  eoNumber: '6601202604240003'
  url: http://publication.pravo.gov.ru/document/6601202604240003
  note: для детей, перечень по этому приказу здесь пока не разобран
quotes:
- point: прил. 1, п. 1.3
  text_verbatim: 'Паллиативная медицинская помощь взрослому населению Свердловской области в амбулаторных условиях, в том числе на дому, оказывается: - в кабинетах паллиативной медицинской помощи (далее
    - кабинеты ПМП) медицинских организаций, оказывающих первичную медико-санитарную помощь; - в кабинетах ПМП медицинских организаций, оказывающих специализированную помощь; - отделениями выездной патронажной
    службы государственных медицинских организаций Свердловской области.'
  page: 7
  verified: false
- point: прил. 1, п. 1.4
  text_verbatim: 'Паллиативная медицинская помощь взрослому населению в условиях стационара оказывается: - медицинскими организациями, оказывающими специализированную, в том числе высокотехнологичную медицинскую
    помощь и имеющими в структуре отделения паллиативной медицинской помощи, отделения сестринского ухода.'
  page: 7
  verified: false
- point: прил. 1, п. 1.5, начало
  text_verbatim: Координацию деятельности медицинских организаций, оказывающих паллиативную медицинскую помощь, медицинских организаций, оказывающих первичную медико-санитарную, специализированную, в том
    числе высокотехнологичную, осуществляет ОМЦ (телефон 8-800-100-06-26
  page: 7
  verified: false
