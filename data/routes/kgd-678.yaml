quotes:
  - point: "прил. 1, п. 1"
    text_verbatim: "Оказание паллиативной медицинской помощи (далее – ПМП) осуществляется с учетом права пациента на выбор врача и медицинской организации."
    page: 3
    verified: false
  - point: "прил. 1, п. 2, вводная часть"
    text_verbatim: "В медицинской организации, в которой пациент получает медицинскую помощь в стационарных или в амбулаторных условиях, принимается решение врачебной комиссии (подкомиссии врачебной комиссии):"
    page: 3
    verified: false
  - point: "прил. 1, п. 3"
    text_verbatim: "Решение врачебной комиссии (подкомиссии врачебной комиссии) вносится в медицинскую документацию пациента."
    page: 3
    verified: false
