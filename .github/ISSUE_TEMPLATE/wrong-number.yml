name: Неверный номер
description: Номер не отвечает, отвечает другая организация, другие часы или неточная подпись
title: "Номер: "
labels: ["report:number"]
body:
  - type: markdown
    attributes:
      value: |
        **Это сообщение увидят все. Не пишите ФИО, диагнозы, адреса, свои телефоны и номера документов.** Не называйте сотрудника, который ответил

        Что будет дальше: номер посмотрит мейнтейнер и сверит с таблицей Росздравнадзора. Проверку звонком делает куратор региона, если он есть. Куратор есть не в каждом регионе, поэтому ответ может прийти не сразу. Сами мы никуда не звоним
  - type: input
    id: region
    attributes:
      label: Регион
      description: Код региона, например RU-KGD. Если вы пришли со страницы региона, он уже заполнен
    validations:
      required: true
  - type: input
    id: line
    attributes:
      label: Номер в наших данных
      description: Код строки, например ru-kgd-rzn-84012535202. Можно оставить пустым
  - type: input
    id: data_version
    attributes:
      label: Версия данных
      description: Заполняется сама, если вы пришли со страницы региона
  - type: dropdown
    id: what
    attributes:
      label: Что не так
      options:
        - не отвечает
        - отвечает другая организация
        - другие часы работы
        - неверная подпись
        - другое
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Где вы видели правильный номер
      description: Ссылка на официальный сайт ведомства или документ. Не пишите ФИО, диагнозы и адреса
  - type: checkboxes
    id: privacy
    attributes:
      label: Перед отправкой
      options:
        - label: В сообщении нет ФИО, диагнозов, адресов, личных телефонов и номеров документов
          required: true
