name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PD_DATA_MODE: ${{ vars.PD_DATA_MODE || 'links' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.7"
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run python -m opsite build
      - run: uv run python -m opsite check --ci
      - name: pack
        env:
          REPO: ${{ github.event.repository.name }}
          TAG: ${{ github.ref_name }}
        run: |
          zip -qr "$REPO-$TAG-site.zip" _site
          (cd _site && zip -qr "../$REPO-$TAG-data.zip" data)
          sha256sum ./*.zip > SHA256SUMS
          cat SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" ./*.zip SHA256SUMS --verify-tag --generate-notes --notes "Режим данных: $PD_DATA_MODE"
