[project]
name = "pal-directory"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "jinja2==3.1.6",
  "pyyaml==6.0.3",
  "jsonschema==4.26.0",
  "markdown-it-py==4.2.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]
pipeline = [
    "defusedxml==0.7.1",
    "openpyxl==3.1.5",
]

[tool.uv]
package = false
default-groups = ["dev", "pipeline"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
pythonpath = ["."]
